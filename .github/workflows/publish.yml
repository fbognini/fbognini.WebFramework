name: publish

# A tag is the trigger because it pins exactly which commit produced a given version: relaunching a
# manual run from a moving branch would publish a different tree under the same version number.
# Dispatch stays as an escape hatch for a re-run after a partially failed push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version to publish, e.g. 11.3.3 or 11.4.0-alpha.1'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    # The trusted publishing policy validates the repository, the workflow file and the environment —
    # it does not restrict which ref ran it. The approval on this environment is that missing check.
    environment: nuget

    permissions:
      id-token: write   # lets this job request the OIDC token nuget.org exchanges for a temporary key
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The library multi-targets net6.0 and net7.0 as well, so their reference assemblies have to be available.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Resolve version from the tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid SemVer version. Tag as v11.3.3 or v11.3.3-alpha.1."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release

      # Only the main package is published here: fbognini.WebFramework.Logging.MSSqlServer carries its own
      # version line (1.0.0) and does not move with it, and the example under examples/ must never be pushed.
      # Version comes in as a property rather than a VersionPrefix because the csproj sets <Version>, which would win over it.
      - name: Pack fbognini.WebFramework
        run: >
          dotnet pack src/fbognini.WebFramework/fbognini.WebFramework.csproj
          --configuration Release --output ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: Check the package carries the expected version
        shell: bash
        run: |
          if [ ! -f "./artifacts/fbognini.WebFramework.${{ steps.version.outputs.version }}.nupkg" ]; then
            echo "::error::No package was produced for fbognini.WebFramework ${{ steps.version.outputs.version }}."
            ls -1 ./artifacts
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.nupkg

      # The key lasts about an hour, so it is requested here rather than at the top of the job.
      - name: Exchange the OIDC token for a temporary NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push fbognini.WebFramework
        run: >
          dotnet nuget push ./artifacts/fbognini.WebFramework.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
